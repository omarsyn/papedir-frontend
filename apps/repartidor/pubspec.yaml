name: repartidor
description: App Repartidor de PaPedir
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  firebase_core: ^3.15.2
  firebase_messaging: ^15.1.3
  go_router: ^14.6.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  local_auth: 2.3.0
  google_fonts: 9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo.png"
  adaptive_icon_background: "#1C1513"
  adaptive_icon_foreground: "assets/images/Logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/Logo.png
